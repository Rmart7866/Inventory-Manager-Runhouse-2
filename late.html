<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Orders</title>
<!--
  Dropship orders still waiting on the supplier, oldest first. Read live from
  Shopify by the Worker (worker/src/late-orders.js). Late is one number for
  every brand, set at the top of the page. Chase notes are the staff's own.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161d29; --surface-2: #1b2331;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --text: #eef2f8; --muted: #c2ccd9; --muted-2: #a6b1c0;
  --accent: #4c9bff; --ok: #3ddc97; --bad: #ff7a90; --warn: #f2c14e;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0; font-size: 18px; }
header .sp { flex: 1; }
header a { color: var(--muted); font-size: 14px; }
main { max-width: 1000px; margin: 0 auto; padding: 22px 24px 90px; }
.sub { color: var(--muted-2); font-size: 13.5px; }
.top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.4fr); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; }
.tile b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile.late b { color: var(--bad); }
.tile .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
select, .tile select { background: var(--surface-2); border: 1px solid var(--line-2); padding: 6px 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.chip { background: var(--surface-2); border: 1px solid var(--line-2); padding: 7px 14px; cursor: pointer; font-weight: 600; }
.chip.on { border-color: var(--accent); background: rgba(76,155,255,.15); }
.chip.small { padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.chip:disabled { opacity: .55; cursor: default; }
.sp { flex: 1; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-2); padding: 12px 14px; margin-bottom: 8px; }
.row.late { border-left-color: var(--bad); }
.days { text-align: center; }
.days b { display: block; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.days span { font-size: 12px; color: var(--muted-2); }
.row.late .days b { color: var(--bad); }
.head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.head .po { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; }
.brand { font-weight: 700; }
.items { margin: 4px 0 0; padding: 0; list-style: none; font-size: 14px; }
.items li { color: var(--muted); }
.info { margin-top: 6px; font-size: 13.5px; }
.info .held { color: var(--warn); }
.info .seen { color: var(--ok); }
.note { margin-top: 6px; font-size: 13.5px; background: var(--surface-2); padding: 6px 8px; border-left: 2px solid var(--accent); }
.note .who { color: var(--muted-2); font-size: 12.5px; }
.add { margin-top: 8px; display: grid; gap: 6px; }
.add textarea, .add input { background: var(--bg); border: 1px solid var(--line-2); padding: 7px 9px; width: 100%; }
.add .btns { display: flex; gap: 8px; }
.msg { padding: 10px 12px; border: 1px solid var(--line-2); margin: 12px 0; font-size: 14px; }
.msg.bad { border-color: var(--bad); color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #0b0f16; border: 1px solid var(--line-2); padding: 8px 14px; font-size: 14px; z-index: 20; }
#gate { max-width: 460px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); padding: 20px; }
#gate .err { color: var(--bad); margin-top: 8px; }
@media (max-width: 720px) {
  main { padding: 16px 16px 80px; } header { padding: 12px 16px; }
  .top { grid-template-columns: 1fr 1fr; } .top .tile:last-child { grid-column: 1 / -1; }
  .row { grid-template-columns: 56px minmax(0, 1fr); } .row .act { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header><h1>Late orders</h1><span class="sp"></span><a href="tracking.html">Tracking updates</a><a href="index.html">Home</a></header>

<section id="gate" class="hidden">
  <h2 style="margin-top:0">Write secret needed</h2>
  <p>This page reads orders through the same Worker as the other staff tools. Paste the write secret once and this browser keeps it.</p>
  <form id="gate-form" style="display:flex;gap:8px"><input type="password" id="gate-in" autocomplete="off" placeholder="Write secret" style="flex:1;background:var(--bg);border:1px solid var(--line-2);padding:8px 10px"><button class="chip on" type="submit">Unlock</button></form>
  <div class="err" id="gate-err"></div>
</section>

<main id="app" class="hidden">
  <div class="top">
    <div class="tile late"><b id="n-late">0</b><span>late</span></div>
    <div class="tile"><b id="n-all">0</b><span>waiting on suppliers</span></div>
    <div class="tile"><span class="sub">Dropship orders still waiting at Needham, oldest first.</span>
      <div class="ctl"><label class="sub">Late after <select id="limit"></select></label><button type="button" class="chip small" id="refresh">Refresh</button><span class="sub" id="asof"></span></div></div>
  </div>
  <div class="bar">
    <div id="filters" style="display:flex;gap:6px" role="group" aria-label="Show"></div>
    <select id="brand" aria-label="Brand"></select>
    <span class="sp"></span>
    <button type="button" class="chip small" id="copy" title="Copies the orders shown as plain text, for an email to the rep">Copy list</button>
  </div>
  <div id="out"></div>
</main>
<div class="toast hidden" id="toast" role="status"></div>

<script src="catalog-client.js?v=23"></script>
<script src="late.js?v=3"></script>
</body>
</html>
