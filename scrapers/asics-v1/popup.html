<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin: 5px 0;
    }
    .btn:hover {
      background: #1557b0;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h3>ASICS Inventory Exporter</h3>
  
  <button id="exportBtn" class="btn">Export Current Page</button>
  <button id="exportAllBtn" class="btn">Export All Products</button>
  
  <div id="status"></div>
  
  <div style="margin-top: 20px; font-size: 12px; color: #666;">
    Navigate to ASICS product pages and click export to download inventory data as CSV.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
