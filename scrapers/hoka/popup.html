<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    h3 {
      margin: 0 0 16px 0;
      color: #ff6600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn {
      background: #ff6600;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background: #e55a00;
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      margin: 12px 0;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
    }
    
    .success { 
      background: #e8f5e8; 
      color: #137333; 
      border: 1px solid #81c995;
    }
    
    .error { 
      background: #fce8e6; 
      color: #d93025; 
      border: 1px solid #f28b82;
    }
    
    .info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }
    
    .footer {
      margin-top: 16px;
      font-size: 11px;
      color: #5f6368;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>🏃‍♂️ Hoka Inventory Scraper</h3>
  
  <button id="exportBtn" class="btn">📊 Export Current Page</button>
  <button id="exportAllBtn" class="btn" disabled>🔄 Bulk Export (Coming Soon)</button>
  
  <div id="status"></div>
  
  <div class="footer">
    Navigate to Hoka product pages and click export to download inventory data as CSV files.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
