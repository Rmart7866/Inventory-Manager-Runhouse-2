<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 340px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 400;
    }
    
    .main-button {
      background: rgba(255, 255, 255, 0.95);
      color: #5b21b6;
      border: none;
      padding: 16px 24px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin: 12px 0;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .main-button:hover {
      background: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    
    .main-button:active {
      transform: translateY(0);
    }
    
    .secondary-button {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .secondary-button:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .status {
      margin: 20px 0;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    
    .status.success {
      background: rgba(52, 211, 153, 0.2);
      border-color: rgba(52, 211, 153, 0.5);
    }
    
    .status.error {
      background: rgba(248, 113, 113, 0.2);
      border-color: rgba(248, 113, 113, 0.5);
    }
    
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 20px 0;
    }
    
    .icon {
      width: 20px;
      height: 20px;
    }
    
    .footer {
      margin-top: 24px;
      font-size: 11px;
      opacity: 0.8;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">New Balance</div>
    <div class="subtitle">Inventory Exporter for Shopify</div>
  </div>
  
  <button id="startWatchingBtn" class="main-button">
    <span>🎯</span>
    <span>Start Watching</span>
  </button>
  
  <div class="divider"></div>
  
  <button id="quickExportBtn" class="secondary-button">
    📊 Quick Export Current Page
  </button>
  
  <button id="settingsBtn" class="secondary-button">
    ⚙️ Settings
  </button>
  
  <div id="status" class="status"></div>
  
  <div class="footer">
    Navigate to product pages and click Start Watching to capture inventory as you scroll.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
