<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking Updates</title>
<!--
  Supplier shipping emails to Shopify tracking. The Apps Script in the
  needham@ mailbox (tools/tracking-mailbox.gs) sends each shipping email to the
  Worker (worker/src/tracking.js), which matches the PO to an order. This page
  lists what it did, what it would do in dry run, and what needs a person.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161d29; --surface-2: #1b2331;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --text: #eef2f8; --muted: #c2ccd9; --muted-2: #a6b1c0;
  --accent: #4c9bff; --ok: #3ddc97; --bad: #ff7a90; --warn: #f2c14e;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0; font-size: 18px; }
header .sp { flex: 1; }
header a { color: var(--muted); font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 22px 24px 90px; }
.sub { color: var(--muted-2); font-size: 13.5px; }
.banner { border: 1px solid var(--line-2); border-left: 3px solid var(--warn); background: var(--surface); padding: 10px 14px; margin: 0 0 14px; font-size: 14px; }
.banner.live { border-left-color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.chip { background: var(--surface-2); border: 1px solid var(--line-2); padding: 7px 14px; cursor: pointer; font-weight: 600; }
.chip.on { border-color: var(--accent); background: rgba(76,155,255,.15); }
.chip:disabled { opacity: .55; cursor: default; }
.chip.arm { border-color: var(--warn); color: var(--warn); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
td .why { color: var(--muted-2); font-size: 13px; margin-top: 2px; }
.st { font-weight: 700; white-space: nowrap; }
.st.review, .st.error { color: var(--warn); }
.st.written { color: var(--ok); }
.st.ready { color: var(--accent); }
.st.already { color: var(--muted-2); }
.trk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
.msg { padding: 10px 12px; border: 1px solid var(--line-2); margin: 12px 0; font-size: 14px; }
#gate { max-width: 460px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); padding: 20px; }
#gate .err { color: var(--bad); margin-top: 8px; }
@media (max-width: 720px) {
  main { padding: 16px 16px 80px; } header { padding: 12px 16px; }
  table, thead, tbody, tr, td { display: block; } thead { display: none; }
  tr { border-bottom: 1px solid var(--line-2); padding: 6px 0; } td { border: 0; padding: 3px 10px; }
}
</style>
</head>
<body>
<header><h1>Tracking updates</h1><span class="sp"></span><a href="index.html">Home</a></header>

<section id="gate" class="hidden">
  <h2 style="margin-top:0">Write secret needed</h2>
  <p>This page reads orders through the same Worker as the other staff tools. Paste the write secret once and this browser keeps it.</p>
  <form id="gate-form" style="display:flex;gap:8px"><input type="password" id="gate-in" autocomplete="off" placeholder="Write secret" style="flex:1;background:var(--bg);border:1px solid var(--line-2);padding:8px 10px"><button class="chip on" type="submit">Unlock</button></form>
  <div class="err" id="gate-err"></div>
</section>

<main id="app" class="hidden">
  <div id="banner"></div>
  <div class="chips" id="filters" role="group" aria-label="Show"></div>
  <div id="out"></div>
</main>

<script src="catalog-client.js?v=23"></script>
<script src="tracking.js?v=1"></script>
</body>
</html>
