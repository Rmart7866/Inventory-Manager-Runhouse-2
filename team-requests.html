<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Store Requests</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Team store requests, the staff side of the Build Your Team Store page.
  Customers file requests on the storefront; the Worker stores them; this
  page lists, edits and builds them. Every call needs the write secret, so
  this public page shows nothing without it.
-->
<style>
:root {
  --bg: #0d1117; --surface: #161d29; --surface-2: #1b2331;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --text: #eef2f8; --muted: #c2ccd9; --muted-2: #a6b1c0;
  --accent: #4c9bff; --ok: #3ddc97; --bad: #ff7a90; --warn: #f2c14e;
  --ring: 0 0 0 2px rgba(76,155,255,.45);
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

header.top { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 17px; margin: 0; font-weight: 700; }
header.top .sp { flex: 1; }
header.top .toplink { color: var(--muted); font-size: 14px; margin-left: 6px; }
.nextstep { margin-top: 10px; font-size: 14.5px; }
.nextstep b { color: var(--text); }
.nextstep button { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
details.more { margin: 10px 0; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details.more[open] summary { margin-bottom: 8px; }
.btn { background: var(--surface-2); border: 1px solid var(--line-2); padding: 7px 12px; cursor: pointer; font-weight: 600; min-height: 34px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #06121f; }
.btn.danger { color: var(--bad); }
.btn.danger.arm, .btn.arm, .chip.arm { background: var(--bad); color: #1a0509; border-color: var(--bad); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--ring); }
input[type=text], input[type=number], input[type=search], input[type=password], select, textarea {
  background: var(--bg); border: 1px solid var(--line-2); padding: 7px 9px; min-height: 34px; }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

/* gate */
#gate { max-width: 420px; margin: 12vh auto; padding: 24px; background: var(--surface); border: 1px solid var(--line); }
#gate h2 { margin: 0 0 6px; font-size: 18px; }
#gate p { color: var(--muted); margin: 0 0 16px; }
#gate form { display: flex; gap: 8px; }
#gate input { flex: 1; }
#gate .err { color: var(--bad); margin-top: 10px; }

/* layout */
#app { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: calc(100vh - 63px); }
#side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
#side .filters { display: flex; border-bottom: 1px solid var(--line); }
#side .filters button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 4px; cursor: pointer; color: var(--muted); font-weight: 600; }
#side .filters button.on { color: var(--text); border-bottom-color: var(--accent); }
#side .search { padding: 10px; border-bottom: 1px solid var(--line); }
#side .search input { width: 100%; }
#list { overflow: auto; flex: 1; }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.row:hover { background: var(--surface-2); }
.row.on { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.row .t span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--muted-2); font-size: 12.5px; margin-top: 2px; }
.pill { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap; }
.pill.new { color: var(--accent); } .pill.progress { color: var(--warn); } .pill.waiting { color: #c3a6ff; }
.pill.done { color: var(--ok); } .pill.archived { color: var(--muted-2); }
.empty { color: var(--muted-2); padding: 24px 16px; }

#main { min-width: 0; }
#detail { padding: 18px 24px 80px; max-width: 1200px; }
.dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.dhead .team input { font-size: 20px; font-weight: 700; width: 100%; background: transparent; border-color: transparent; padding-left: 0; }
.dhead .team input:hover, .dhead .team input:focus { border-color: var(--line-2); padding-left: 8px; }
.dhead .who { color: var(--muted); }
.dhead .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.dirty-note { color: var(--warn); font-size: 12.5px; }
.flags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.flag { font-size: 12px; color: var(--muted); border: 1px solid var(--line-2); padding: 1px 7px; }
.flag.hot { color: var(--warn); border-color: var(--warn); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.msg { padding: 9px 12px; border: 1px solid var(--line-2); margin: 10px 0; }
.msg.bad { border-color: var(--bad); color: var(--bad); }
.msg.ok { border-color: var(--ok); color: var(--ok); }
.msg.warn { border-color: var(--warn); color: var(--warn); }

/* products */
.item { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; }
.item .name { font-weight: 700; }
.item .sub { color: var(--muted-2); font-size: 12.5px; }
.item .grid { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px 14px; margin-top: 10px; align-items: end; }
.item .grid .wide { grid-column: 1 / -1; }
.item .bar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.item .where { color: var(--muted); }
.item .where b { color: var(--text); font-weight: 600; }
.btn.quiet { background: none; border-color: transparent; }
.btn.quiet:hover:not(:disabled) { border-color: var(--bad); }
.btn.quiet.arm, .btn.quiet.arm:hover:not(:disabled) { background: var(--bad); color: #1a0509; border-color: var(--bad); }
.rel { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.rel label { color: var(--muted); font-weight: 600; }
.rel input[type=date] { background: var(--bg); border: 1px solid var(--line-2); padding: 5px 8px; color-scheme: dark; }
.sub { color: var(--muted-2); font-size: 12.5px; }

/* release calendar */
.calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.calhead h2 { margin: 0 8px; font-size: 19px; min-width: 170px; }
.calhead .sp { flex: 1; }
.key { display: inline-block; width: 18px; height: 10px; vertical-align: middle; border: 1.5px solid var(--accent); }
.key.dash { border-style: dashed; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dow { padding: 6px 8px; color: var(--muted-2); font-size: 12px; font-weight: 600; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .day { min-height: 96px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .day.out { background: rgba(255,255,255,.02); }
.cal .day.out .dn { color: var(--muted-2); opacity: .5; }
.cal .day.today .dn { color: #06121f; background: var(--accent); padding: 0 5px; }
.cal .dn { font-size: 12px; color: var(--muted); align-self: flex-start; font-weight: 600; }
.ev { display: block; width: 100%; text-align: left; font-size: 13px; line-height: 1.3; font-weight: 600; padding: 3px 6px; background: var(--surface-2); border: 1.5px solid currentColor; cursor: pointer; overflow-wrap: anywhere; }
.chips .ev { width: auto; }
.ev.asked { border-style: dashed; }
.ev.new { color: var(--accent); } .ev.progress { color: var(--warn); } .ev.waiting { color: #c3a6ff; } .ev.done { color: var(--ok); }
.item .bad { color: var(--bad); font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); padding: 3px 8px; background: none; cursor: pointer; font-size: 12.5px; }
.chip.on { border-color: var(--accent); background: rgba(76,155,255,.12); }
.chip.unk { border-color: var(--bad); color: var(--bad); background: rgba(255,122,144,.1); text-decoration: line-through; }
.chip i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); flex: none; }
.allcols { margin-top: 8px; padding: 8px; border: 1px dashed var(--line-2); }

/* the garment tile: white, because the catalog photos are shot on white */
.mk { position: relative; display: block; background: #fff; line-height: 0; }
.mk > img.g { width: 100%; height: auto; display: block; }
.mk > .lb { position: absolute; }
.mk > .lb > img { width: 100%; height: 100%; object-fit: contain; object-position: top center; display: block; }
.mk > .lb > span { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; font: 700 10px/1 'DM Sans', sans-serif; color: #888; outline: 1px dashed #aaa; text-align: center; }

.adder { margin-top: 14px; position: relative; max-width: 520px; }
.adder input { width: 100%; }
.adder .res { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface-2); border: 1px solid var(--line-2); z-index: 4; max-height: 320px; overflow: auto; }
.adder .res button { display: flex; gap: 10px; align-items: center; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; cursor: pointer; }
.adder .res button:hover { background: var(--surface); }
.adder .res img { width: 40px; height: 40px; object-fit: contain; background: #fff; }

/* logos */
.logos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.logo { background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.checker { height: 150px; display: flex; align-items: center; justify-content: center;
  background: #fff repeating-conic-gradient(#e6e6e6 0% 25%, #fff 0% 50%) 50% / 16px 16px; margin-bottom: 10px; }
.checker img { max-width: 92%; max-height: 92%; }
.checker span { color: #666; font-weight: 700; }
.logo .warn { color: var(--warn); font-size: 12.5px; margin: 4px 0; }

/* build */
table.plan { width: 100%; border-collapse: collapse; margin: 10px 0; }
table.plan th, table.plan td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plan th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 14px; max-width: 760px; }
pre.orig { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); padding: 12px; max-height: 480px; overflow: auto; font-size: 12.5px; }
.log li { color: var(--muted); margin-bottom: 4px; }

/* placement editor */
#pe { position: fixed; inset: 0; background: rgba(5,8,13,.78); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px; }
#pe .box { background: #111828; border: 1px solid var(--line-2); display: grid; grid-template-columns: auto 280px; gap: 20px; padding: 20px; max-width: 100%; max-height: 100%; overflow: auto; }
#pe .stage { width: min(520px, 70vw); position: relative; user-select: none; touch-action: none; }
#pe .lb { outline: 2px dashed var(--accent); cursor: move; }
#pe .lb .h { position: absolute; right: -8px; bottom: -8px; width: 16px; height: 16px; background: var(--accent); cursor: nwse-resize; }
#pe .side h3 { margin: 0 0 4px; font-size: 16px; }
#pe .side p { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
#pe .side .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
#pe .readout { font-variant-numeric: tabular-nums; color: var(--muted-2); font-size: 12px; margin-top: 8px; }


/* ==== Readability ===================================================
   Nothing on this page is smaller than 13px, and the secondary greys were
   lifted so every text colour clears 4.5:1 on the surfaces it sits on
   (measured, see the commit). The earlier page had 11 to 12.5px labels in
   a grey that was fine for contrast and hard to read at that size. */
label.f { font-size: 13px; color: var(--muted); }
.sub, .row .m, .item .sub, .readout, .ev, .cal .dow, .cal .dn { font-size: 13px; }
.pill { font-size: 13px; padding: 2px 8px; }
.row { padding: 12px 14px; }
.row .t { font-size: 15px; }
.chip { font-size: 13.5px; padding: 4px 9px; }
.msg { line-height: 1.5; }
.tabs button { font-size: 15px; }
.flag { font-size: 13px; }
.empty { font-size: 14px; }

/* list tags: what needs attention, in words, not just colour */
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 13px; font-weight: 600; padding: 1px 7px; border: 1px solid var(--line-2); color: var(--muted); }
.tag.approved { color: var(--ok); border-color: var(--ok); }
.tag.changes, .tag.stale, .tag.closing, .tag.dup { color: var(--warn); border-color: var(--warn); }
#side .me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
#side .me span { white-space: nowrap; }
#side .me input { flex: 1; min-width: 0; min-height: 30px; padding: 4px 8px; }
#side .filters button { font-size: 14px; }
#side .filters .n { color: var(--muted-2); font-weight: 600; margin-left: 4px; }
body:not(.home) #side .filters { overflow-x: auto; }
body:not(.home) #side .filters button { flex: none; padding: 10px 7px; font-size: 13px; }
body:not(.home) #side .filters .n { margin-left: 2px; }
body:not(.home) #side .filters [data-f=done] .n, body:not(.home) #side .filters [data-f=archived] .n { display: none; }

/* the list: a sidebar while a request is open, the whole page otherwise */
.homeh { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
.lhead { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ltitle { display: none; margin: 0; font-size: 22px; }
.backlink { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; padding: 0; text-align: left; }
.who { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.who i { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 800; color: #0d1117; flex: none; }
.who.none { color: var(--muted-2); font-weight: 500; font-style: italic; }
.row .who { margin-top: 6px; }
body.home #app { grid-template-columns: minmax(0, 1fr); }
body.home #main { display: none; }
body.home #side { border-right: 0; background: var(--bg); }
body.home .backlink { display: none; }
body.home .ltitle { display: block; }
body.home .lhead { flex-direction: row; align-items: center; justify-content: space-between; padding: 22px 28px 14px; border: 0; }
body.home #side .me { font-size: 14px; }
body.home #side .me input { width: 180px; flex: none; }
body.home #side .filters { padding: 0 28px; }
body.home #side .filters button { flex: none; padding: 10px 14px; }
body.home #side .search { padding: 14px 28px; border: 0; }
body.home #side .search input { max-width: 420px; }
body.home #list { padding: 0 28px 60px; overflow: visible; }
.rtable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.rtable th:nth-child(1) { width: 34%; } .rtable th:nth-child(2) { width: 20%; } .rtable th:nth-child(3) { width: 15%; }
.rtable th:nth-child(4) { width: 8%; } .rtable th:nth-child(5) { width: 13%; } .rtable th:nth-child(6) { width: 10%; }
@media (max-width: 900px) { .rtable th:nth-child(1) { width: 50%; } .rtable th:nth-child(2) { width: 28%; } .rtable th:nth-child(3) { width: 22%; } }
.rtable th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
.rtable td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
.rtable tbody tr { cursor: pointer; }
.rtable tbody tr:hover td { background: var(--surface); }
.rtable .tn { font-weight: 700; font-size: 15px; }
.rtable .te { color: var(--muted-2); font-size: 13px; margin-top: 2px; }
.rtable .dim { color: var(--muted); }
.rgroup { margin: 22px 0 6px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.rgroup .c { color: var(--muted-2); font-weight: 500; font-size: 13.5px; }
.claim { font-size: 13px; padding: 3px 10px; margin-left: 8px; }
@media (max-width: 900px) { .rtable .opt { display: none; } }

/* request header */
.rel label { font-size: 13px; }
.rel input[type=text] { background: var(--bg); border: 1px solid var(--line-2); padding: 5px 8px; min-height: 0; }
.linkrow { display: flex; gap: 8px; margin: 8px 0 6px; flex-wrap: wrap; }
.linkrow input { flex: 1; min-width: 260px; font-size: 13.5px; }
.linkrow a.btn { text-decoration: none; display: inline-flex; align-items: center; color: var(--text); }
.msg b { font-weight: 700; }

/* price check */
.item .grid { grid-template-columns: minmax(0, 1fr) 110px 110px; }
.money { margin-top: 8px; font-size: 14px; color: var(--muted); }
.money .okm { color: var(--ok); font-weight: 600; }
.money .thin { color: var(--warn); font-weight: 600; }
.money .neg { color: var(--bad); font-weight: 700; }

/* calendar: orders close */
.ev.close { color: var(--bad); border-style: solid; background: rgba(255,122,144,.08); }
.key.closek { border-color: var(--bad); }


/* team store sales */
.sumrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }
.sumrow div { background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; min-width: 130px; }
.sumrow span { display: block; font-size: 13px; color: var(--muted); }
.sumrow b { font-size: 19px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0 6px; }
.toolbar .sp { flex: 1; }
.toolbar input[type=search] { min-width: 240px; }
.tablewrap { overflow-x: auto; }
table.sales td, table.sales th { white-space: nowrap; }
table.sales th button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; padding: 0; }
table.sales th button:hover { color: var(--text); }
table.sales .num { text-align: right; font-variant-numeric: tabular-nums; }
table.sales th.num button { text-align: right; }
table.sales input { width: 76px; text-align: right; min-height: 30px; padding: 3px 6px; }
table.sales input.pct { width: 56px; }
table.sales tbody tr:hover td { background: rgba(255,255,255,.03); }
table.sales td.owe { color: var(--warn); font-weight: 700; }
.linkish { background: none; border: 0; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; padding: 0; text-align: left; white-space: normal; }
.linkish:hover { color: var(--accent); text-decoration: underline; }
.detail-row td { background: var(--surface); color: var(--muted); white-space: normal !important; }
.detail-row ul { margin: 6px 0 0; padding-left: 18px; }

.golive { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.golive h3 { margin: 0 0 6px; font-size: 16px; }
.btn.pri.arm { background: var(--bad); border-color: var(--bad); color: #1a0509; }

/* placements */
/* page tabs */
.toptabs { display: flex; gap: 2px; margin-left: 14px; }
.toptabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; padding: 8px 12px; cursor: pointer; }
.toptabs button:hover { color: var(--text); }
.toptabs button[aria-current=true] { color: var(--text); border-bottom-color: var(--accent); }
body.full #app { grid-template-columns: minmax(0, 1fr); }
body.full #side { display: none; }
body.full #detail { max-width: none; }

/* placements */
/* supplier stock */
.stockline { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.stockline b.st-low { color: var(--warn); } .stockline b.st-out { color: var(--bad); }
.chip.st-low { border-color: var(--warn); box-shadow: inset 0 -2px 0 var(--warn); }
.chip.st-out { border-color: var(--bad); box-shadow: inset 0 -2px 0 var(--bad); }
.chip.st-out:not(.on) { opacity: .6; }
.pz-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.pz-head h2 { margin: 0; font-size: 22px; }
.pz { display: grid; grid-template-columns: 290px minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
.pz-list { border: 1px solid var(--line); background: var(--surface); max-height: calc(100vh - 150px); overflow: auto; position: sticky; top: 76px; }
.pz-list .tools { padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; display: flex; flex-direction: column; gap: 8px; }
.pz-list .tools input { width: 100%; }
.pz-cat { font-size: 13px; font-weight: 700; color: var(--muted); padding: 14px 12px 4px; text-transform: uppercase; letter-spacing: .04em; }
.pz-row { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 8px 12px; cursor: pointer; }
.pz-row:hover { background: var(--surface-2); }
.pz-row.on { background: var(--surface-2); border-left-color: var(--accent); }
.pz-row .nm { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-row .cd { font-size: 13px; color: var(--muted-2); }
.pz-row .pz-ch, .pz-row .pz-un { display: block; font-size: 13px; margin-top: 2px; }
.pz-ch { color: var(--accent); } .pz-un { color: var(--warn); }
.pz-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pz-title h2 { margin: 0; font-size: 20px; }
.pz-zones { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.pz-zones .chip { font-size: 14px; padding: 6px 12px; }
.pz-zones em { font-style: normal; font-size: 13px; color: var(--warn); }
.pz-zones .chip:not(.on) em { color: var(--accent); }
.pz-photo { background: #fff; display: flex; justify-content: center; padding: 14px; }
.pz-stage { position: relative; width: min(100%, 540px, 66vh); user-select: none; touch-action: none; }
.pz-stage .lb { outline: 2px dashed var(--accent); cursor: move; }
.pz-stage .lb .h { position: absolute; right: -8px; bottom: -8px; width: 16px; height: 16px; background: var(--accent); cursor: nwse-resize; }
.mk > .pz-ghost { position: absolute; outline: 1.5px dashed #8a95a3; pointer-events: none; }
.pz-ghost span { position: absolute; left: -1px; top: -19px; font: 700 12px/1 'DM Sans', sans-serif; color: #4a5560; background: #fff; padding: 2px 4px; white-space: nowrap; }
.mk > .pz-ghost.dan { outline: 2px dashed #e0542a; }
.pz-ghost.dan span { color: #c2410c; }
.pz-side { display: flex; flex-direction: column; gap: 14px; }
.pz-side .card { background: var(--surface); border: 1px solid var(--line); padding: 14px; }
.pz-side h3 { margin: 0 0 4px; font-size: 17px; }
.pz-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pz-nums label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.pz-nums input { width: 100%; }
.pz-side .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.pz-help { font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 18px; }
.pz-help li { margin: 5px 0; }
@media (max-width: 1250px) { .pz { grid-template-columns: 260px minmax(0, 1fr); } .pz-side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
@media (max-width: 820px) { .pz { grid-template-columns: 1fr; } .pz-list { position: static; max-height: 320px; } .toptabs { margin-left: 0; overflow-x: auto; } }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  #side { max-height: 40vh; }
  .item { grid-template-columns: 90px minmax(0, 1fr); }
  .item .grid { grid-template-columns: 1fr; }
  #pe .box { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <h1><button type="button" id="home-h" class="homeh">Team store requests</button></h1>
  <nav class="toptabs" id="toptabs" aria-label="Pages">
    <button type="button" id="home-tab" data-v="home">Requests</button>
    <button type="button" id="cal-open" data-v="cal">Calendar</button>
    <button type="button" id="sales-open" data-v="sales">Store sales</button>
    <button type="button" id="place-open" data-v="place">Placements</button>
  </nav>
  <span class="sp"></span>
  <a href="index.html" class="toplink">Inventory tool</a>
</header>

<section id="gate" class="hidden">
  <h2>Write secret needed</h2>
  <p>Requests carry customer names and emails, so this page needs the same write secret as the inventory tool. Paste it once and this browser keeps it.</p>
  <form id="gate-form"><input type="password" id="gate-in" autocomplete="off" placeholder="Write secret"><button class="btn pri" type="submit">Unlock</button></form>
  <div class="err" id="gate-err"></div>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="lhead">
      <button type="button" id="home-back" class="backlink">&larr; All requests</button>
      <h2 class="ltitle">Requests</h2>
      <label class="me"><span>You are</span><input type="text" id="me" placeholder="Your name" autocomplete="off"></label>
    </div>
    <div class="filters" id="filters">
      <button type="button" data-f="open" class="on">Open</button>
      <button type="button" data-f="unclaimed">Unclaimed</button>
      <button type="button" data-f="mine">Mine</button>
      <button type="button" data-f="done">Done</button>
      <button type="button" data-f="archived">Archived</button>
      <button type="button" data-f="all">All</button>
    </div>
    <div class="search"><input type="search" id="q" placeholder="Search team or email" aria-label="Search team or email"></div>
    <div id="list"></div>
  </aside>
  <main id="main"><div id="detail"><p class="empty">Pick a request on the left.</p></div></main>
</div>

<div id="pe" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pe-h"></div>

<script src="catalog-client.js?v=23"></script>
<script src="team-request-utils.js?v=5"></script>
<script src="team-requests.js?v=17"></script>
</body>
</html>
