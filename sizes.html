<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoe Sizes</title>
<!--
  Which shoe sizes are thin at each shop: for every size, how many of the
  styles that shop carries have it on the shelf. Built by the nightly catalog
  rebuild (worker/src/size-coverage.js); read only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161d29; --surface-2: #1b2331;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --text: #eef2f8; --muted: #c2ccd9; --muted-2: #a6b1c0;
  --accent: #4c9bff; --ok: #3ddc97; --bad: #ff7a90; --warn: #f2c14e;
  --bar: #4c9bff; --grid: rgba(255,255,255,.07);
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0; font-size: 18px; }
header .sp { flex: 1; }
header a { color: var(--muted); font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 22px 24px 90px; }
.sub { color: var(--muted-2); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.chip { background: var(--surface-2); border: 1px solid var(--line-2); padding: 8px 16px; cursor: pointer; font-weight: 600; }
.chip.on { border-color: var(--accent); background: rgba(76,155,255,.15); }
.card { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 16px; }
.card h2 { margin: 0; font-size: 18px; }
.callout { margin: 6px 0 14px; font-size: 14.5px; }
.callout b { color: var(--text); }
/* the chart: one bar per size, styles in stock */
.chart { position: relative; display: grid; gap: 2px; align-items: end; height: 190px; padding-top: 22px; border-bottom: 1px solid var(--line-2);
  background-image: linear-gradient(to top, var(--grid) 1px, transparent 1px); background-size: 100% 25%; }
.bar { position: relative; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
.bar i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.thin i { background: var(--warn); }
.bar.sel i { outline: 2px solid var(--text); outline-offset: 1px; }
.bar .flag { position: absolute; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--warn); font-weight: 700; white-space: nowrap; }
.bar:hover i, .bar:focus-visible i { filter: brightness(1.2); }
.bar:focus-visible { outline: none; }
.xaxis { display: grid; gap: 2px; margin-top: 4px; }
.xaxis span { text-align: center; font-size: 12.5px; color: var(--muted); }
.tip { position: fixed; z-index: 20; pointer-events: none; background: #0b0f16; border: 1px solid var(--line-2); padding: 7px 10px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.tip b { display: block; }
table.nums { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
table.nums th, table.nums td { font-size: 12.5px; text-align: center; padding: 3px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.nums th:first-child, table.nums td:first-child { text-align: left; color: var(--muted); width: 120px; font-weight: 400; }
table.nums td.thin { color: var(--warn); font-weight: 700; }
.detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.detail h3 { margin: 0 0 4px; font-size: 15px; }
.style { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.style img, .style .noimg { width: 40px; height: 40px; object-fit: contain; background: #fff; }
.style .have { font-size: 12.5px; color: var(--muted-2); }
.style .have b { color: var(--text); }
/* views, filters, brand and model tables */
.views { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
.views select { background: var(--surface-2); border: 1px solid var(--line-2); padding: 6px 8px; margin-left: 6px; color: var(--text); }
.seg { display: inline-flex; border: 1px solid var(--line-2); }
.seg button { background: none; border: 0; padding: 7px 16px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-selected=true] { background: var(--accent); color: #0b1220; }
table.list { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.list th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
table.list td { padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
table.list .num { text-align: right; font-variant-numeric: tabular-nums; width: 70px; }
table.list tr.click { cursor: pointer; }
table.list tr.click:hover td { background: var(--surface-2); }
table.list tr.ways td { background: var(--bg); }
.stripcol { width: 300px; }
.strip { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 2px; }
.strip .sc { height: 18px; background: rgba(76,155,255,var(--a)); }
.strip .sc.none { background: none; outline: 1px dashed var(--bad); outline-offset: -1px; }
.strip.head span { font-size: 11px; text-align: center; color: var(--muted-2); font-weight: 400; }
.warnt { color: var(--warn); font-weight: 600; }
.elsewhere { margin-top: 2px; color: var(--ok); }
.mrow { display: flex; gap: 10px; align-items: center; }
.mrow img, .mrow .noimg { width: 40px; height: 40px; object-fit: contain; background: #fff; flex: none; }
.mrow b { display: block; }
@media (max-width: 720px) { .stripcol { width: 150px; } table.list .num { width: 46px; } }
.msg { padding: 10px 12px; border: 1px solid var(--line-2); margin: 12px 0; font-size: 14px; }
.msg.bad { border-color: var(--bad); color: var(--bad); }
#gate { max-width: 460px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); padding: 20px; }
#gate .err { color: var(--bad); margin-top: 8px; }
@media (max-width: 720px) { main { padding: 16px 16px 80px; } header { padding: 12px 16px; } .chart { height: 150px; } .xaxis span, table.nums th, table.nums td { font-size: 10.5px; } table.nums th:first-child, table.nums td:first-child { width: 72px; } }
</style>
</head>
<body>
<header><h1>Shoe sizes</h1><span class="sp"></span><a href="index.html">Home</a></header>

<section id="gate" class="hidden">
  <h2 style="margin-top:0">Write secret needed</h2>
  <p>This page reads store data through the same Worker as the other staff tools. Paste the write secret once and this browser keeps it.</p>
  <form id="gate-form" style="display:flex;gap:8px"><input type="password" id="gate-in" autocomplete="off" placeholder="Write secret" style="flex:1;background:var(--bg);border:1px solid var(--line-2);padding:8px 10px"><button class="chip on" type="submit">Unlock</button></form>
  <div class="err" id="gate-err"></div>
</section>

<main id="app" class="hidden">
  <div class="sub" id="asof"></div>
  <div class="chips" id="locs" role="group" aria-label="Shop"></div>
  <div id="out"></div>
</main>
<div class="tip hidden" id="tip" role="tooltip"></div>

<script src="catalog-client.js?v=23"></script>
<script src="sizes.js?v=5"></script>
</body>
</html>
